[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-reolink-baichuan"
version = "0.1.0"
description = "Standalone Home Assistant integration for Baichuan-only Reolink cameras (IPC_517SD5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pycryptodomex>=3.20.0",
    "reolink-aio>=0.20.0",
    "voluptuous>=0.13.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.20.0",
    "homeassistant-stubs>=2024.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["custom_components", "tests"]
extraPaths = ["."]
reportMissingImports = "warning"